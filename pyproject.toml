[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-coach"
version = "1.0.0"
description = "Hydration reminders with an opt-in local webcam proximity hint"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ronak Soltani"}]
dependencies = ["plyer>=2.1"]

[project.optional-dependencies]
camera = ["opencv-python>=4.9"]
dev = ["pytest>=8.0"]

[project.scripts]
desk-coach = "desk_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
